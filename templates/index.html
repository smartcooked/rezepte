<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="rezepte-build" content="$build_stamp">
<title>$site_title</title>
<meta name="description" content="Rezeptkatalog mit Suche, Filter und Sortierung.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css?v=$build_stamp">
</head>
<body>
$icons
<header class="topbar"><div class="wrap"><a class="brand" href="./"><svg class="icon"><use href="#i-logo"/></svg>$brand_html</a></div></header>
<main class="wrap">
  <div class="cat-head"><h1>Alle Rezepte</h1><p id="cat-sub">$count_label</p></div>
  <div class="toolbar" id="toolbar">
    <label class="search"><svg class="icon"><use href="#i-search"/></svg><span class="sr">Rezepte durchsuchen</span><input type="search" id="q" placeholder="Rezept, Zutat oder Stichwort suchen" autocomplete="off"><button type="button" id="q-clear" aria-label="Suche löschen" hidden><svg class="icon"><use href="#i-x"/></svg></button></label>
    <div class="filters" id="filters">
      <span class="sel"><select id="f-cat" aria-label="Kategorie"><option value="">Alle Kategorien</option></select><svg class="icon"><use href="#i-chevron"/></svg></span>
      <span class="sel"><select id="f-diet" aria-label="Ernährung"><option value="">Ernährung</option></select><svg class="icon"><use href="#i-chevron"/></svg></span>
      <span class="sel"><select id="f-diff" aria-label="Schwierigkeit"><option value="">Schwierigkeit</option><option value="simpel">simpel</option><option value="normal">normal</option><option value="pfiffig">pfiffig</option></select><svg class="icon"><use href="#i-chevron"/></svg></span>
      <span class="sel"><select id="f-time" aria-label="Gesamtzeit"><option value="">Zeit</option><option value="20">bis 20 Min.</option><option value="30">bis 30 Min.</option><option value="45">bis 45 Min.</option><option value="60">bis 60 Min.</option></select><svg class="icon"><use href="#i-chevron"/></svg></span>
      <span class="spacer"></span>
      <span class="sel"><select id="sort" aria-label="Sortierung"><option value="new">Neueste zuerst</option><option value="az">A bis Z</option><option value="time">Kürzeste Zeit</option><option value="kcal">Wenigste Kalorien</option></select><svg class="icon"><use href="#i-sort"/></svg></span>
      <button class="chip" type="button" id="reset" hidden><svg class="icon"><use href="#i-x"/></svg>Filter zurücksetzen</button>
    </div>
  </div>
  <div class="grid-cards" id="cards"></div>
</main>
<footer class="foot"><div class="wrap"><span class="brand small">$brand_html</span><span>·</span><span>$count_label</span><span>·</span><span>Stand $today</span></div></footer>
<script id="data" type="application/json">$index_json</script>
<script src="app.js?v=$build_stamp"></script>
</body>
</html>
